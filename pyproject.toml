[project]
name = "bolo"
version = "0.1.0"
description = "Local TTS for terminal — Kokoro voice with live-subtitle HUD synced to audio"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sumanth Mukkala" }]
requires-python = ">=3.10"
dependencies = [
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]
keywords = ["tts", "kokoro", "claude-code", "terminal", "subtitles", "accessibility"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/sumanthmukkala/bolo"
Issues = "https://github.com/sumanthmukkala/bolo/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
